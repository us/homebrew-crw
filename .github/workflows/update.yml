name: Update Formulas

on:
  repository_dispatch:
    types: [crw-release]
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (e.g. 0.3.1)"
        required: true

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Determine version
        id: version
        run: |
          if [ -n "${{ github.event.client_payload.version }}" ]; then
            echo "version=${{ github.event.client_payload.version }}" >> "$GITHUB_OUTPUT"
          else
            echo "version=${{ github.event.inputs.version }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Download and hash assets
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          mkdir -p /tmp/assets

          for bin in crw crw-mcp crw-server; do
            for plat in darwin-arm64 darwin-x64 linux-arm64 linux-x64; do
              asset="${bin}-${plat}.tar.gz"
              echo "Downloading ${asset}..."
              gh release download "v${VERSION}" --repo us/crw --pattern "${asset}" -D /tmp/assets --clobber
              sha=$(sha256sum "/tmp/assets/${asset}" | cut -d' ' -f1)
              echo "${bin}_${plat//-/_}_sha256=${sha}" >> "$GITHUB_ENV"
            done
          done
          echo "VERSION=${VERSION}" >> "$GITHUB_ENV"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Update formulas
        run: |
          update_formula() {
            local file="$1" bin="$2"
            local prefix="${bin//-/_}"

            # Update version
            sed -i "s/version \".*\"/version \"${VERSION}\"/" "$file"

            # Update sha256 for each platform
            # Darwin ARM
            local key="${prefix}_darwin_arm64_sha256"
            local sha="${!key}"
            sed -i "/crw.*darwin-arm64/{n;s/sha256 \".*\"/sha256 \"${sha}\"/}" "$file"

            # Darwin x64
            key="${prefix}_darwin_x64_sha256"
            sha="${!key}"
            sed -i "/crw.*darwin-x64/{n;s/sha256 \".*\"/sha256 \"${sha}\"/}" "$file"

            # Linux ARM
            key="${prefix}_linux_arm64_sha256"
            sha="${!key}"
            sed -i "/crw.*linux-arm64/{n;s/sha256 \".*\"/sha256 \"${sha}\"/}" "$file"

            # Linux x64
            key="${prefix}_linux_x64_sha256"
            sha="${!key}"
            sed -i "/crw.*linux-x64/{n;s/sha256 \".*\"/sha256 \"${sha}\"/}" "$file"
          }

          update_formula Formula/crw.rb crw
          update_formula Formula/crw-mcp.rb crw-mcp
          update_formula Formula/crw-server.rb crw-server

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Formula/
          git diff --staged --quiet && echo "No changes" && exit 0
          git commit -m "chore: update formulas to v${VERSION}"
          git push
